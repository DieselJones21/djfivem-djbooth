<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ FIVEM Scripts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@320;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* Critical: FiveM always paints ui_page. Never show the tablet until JS adds .is-open. */
        html, body { background: transparent !important; pointer-events: none; }
        body:not(.fivem) { pointer-events: auto; }
        #stage { display: none !important; }
        #stage.is-open { display: grid !important; place-items: center; pointer-events: auto; }
        #previewBar { display: none !important; }
        #previewBar.is-open { display: flex !important; }
    </style>
</head>
<body>
    <div class="stage" id="stage" hidden>
        <div class="preview-bar" id="previewBar" hidden>
            <button data-preview="booth">DJ Booth</button>
            <button data-preview="admin">Admin</button>
            <button data-preview="create">Place Wizard</button>
            <button data-preview="speaker">Speaker</button>
        </div>

        <div class="tablet" id="tablet">
            <div class="bezel">
                <div class="notch">
                    <span class="cam"></span>
                    <span class="mic"></span>
                </div>
                <div class="screen" id="screen">
                    <div class="screen-mark" aria-hidden="true"></div>
                    <header class="status">
                        <span class="status-left">
                            <img class="status-mark" src="images/brand/djfivem-mark.png" alt="">
                            <span id="clock">12:40</span>
                        </span>
                        <span class="status-pills">
                            <span>5G</span>
                            <span class="battery">87%</span>
                            <button class="status-close" id="statusClose" type="button" title="Close">Close</button>
                        </span>
                    </header>

                    <div class="app" id="app">
                        <aside class="sidebar">
                            <div class="brand">
                                <div class="brand-plate">
                                    <img class="brand-logo" src="images/brand/djfivem-logo.png" alt="DJ FIVEM Scripts">
                                </div>
                                <small id="appTag" class="brand-tag">Booth OS</small>
                                <strong id="appName" hidden>DJ FIVEM</strong>
                            </div>

                            <nav class="nav" id="nav"></nav>

                            <div class="sidebar-card" id="boothChip">
                                <p class="eyebrow">Active booth</p>
                                <h3 id="boothName">—</h3>
                                <p id="boothMeta">No signal</p>
                            </div>
                        </aside>

                        <main class="main">
                            <section class="page" id="page"></section>
                            <footer class="player" id="player"></footer>
                        </main>
                    </div>

                    <div class="home-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-root" id="modalRoot"></div>
    <script src="js/app.js"></script>
</body>
</html>
